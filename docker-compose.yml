services:
  app:
    build: .
    container_name: triagedesk
    ports:
      - "8000:8000"
    environment:
      # Provider selection: "mock" runs fully offline (default).
      # For real runs set LLM_PROVIDER=openai and export OPENAI_API_KEY in your shell.
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      TRIAGEDESK_DB_PATH: /app/data/triagedesk.db
    volumes:
      - triagedesk-data:/app/data
      - triagedesk-output:/app/output
    restart: unless-stopped

volumes:
  triagedesk-data:
  triagedesk-output:
