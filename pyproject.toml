[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "triagedesk"
version = "3.0.0"
description = "AI triage desk for customer inquiries: LLM structured-output triage, ticket workflow, RBAC and a bundled web UI on SQLite."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "taozhihaoo" }]
keywords = [
    "llm",
    "openai",
    "fastapi",
    "automation",
    "customer-support",
    "helpdesk",
    "structured-outputs",
    "sqlite",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Office/Business :: Customer Service",
]
dependencies = [
    "openai>=1.40,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
triagedesk = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.desk" = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
ignore = [
    # FastAPI's dependency injection uses function calls (Depends(...)) in
    # parameter defaults - that is the framework idiom, not a bug.
    "B008",
    # Broad exception handling is deliberate at service boundaries: the batch
    # must survive any single failure and the API must not leak tracebacks.
    "BLE001",
]
