name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Import check (no API key needed)
        run: |
          python -c "import src, src.config, src.models, src.llm_client, src.csv_loader, src.processor, src.report_writer, src.storage, src.service, src.main, src.api, src.desk, src.desk.models, src.desk.storage, src.desk.service, src.desk.ai, src.desk.auth, src.desk.api, src.desk.seed, src.desk.workflow; print('all modules import cleanly')"

      - name: Migration check (older SQLite schema opens with the current one)
        run: python -m pytest tests/test_migration.py -v

      - name: Seed check (both demo languages, offline, idempotent)
        run: |
          python -m src.desk.seed --lang en --db "${{ runner.temp }}/ci-en.db"
          python -m src.desk.seed --lang en --db "${{ runner.temp }}/ci-en.db"
          python -m src.desk.seed --lang zh --db "${{ runner.temp }}/ci-zh.db"
          python -m src.desk.seed --lang zh --db "${{ runner.temp }}/ci-zh.db"

      - name: Run tests (offline, mock provider)
        env:
          # make sure CI never has credentials
          OPENAI_API_KEY: ""
        run: pytest -v

      - name: Web UI smoke (static UI + health, no network)
        env:
          TRIAGEDESK_DB_PATH: ${{ runner.temp }}/ci-ui.db
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from src.api import create_app

          client = TestClient(create_app())
          assert client.get("/").status_code == 200
          assert client.get("/assets/app.js").status_code == 200
          assert client.get("/assets/styles.css").status_code == 200
          assert client.get("/auth/dev/agents").status_code == 200
          assert client.get("/health").json()["status"] == "ok"
          print("UI + API smoke passed")
          PY

      # `packages = ["src"]` used to silently omit src.desk and the web assets.
      # Building a wheel and inspecting its members keeps that regression out.
      - name: Build wheel and verify packaged UI assets
        run: |
          python -m pip wheel . --no-deps -w dist
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          required = {
              "src/api.py",
              "src/desk/api.py",
              "src/desk/web/index.html",
              "src/desk/web/styles.css",
              "src/desk/web/app.js",
              "src/desk/web/i18n.js",
              "src/desk/web/favicon.svg",
          }
          missing = required - names
          assert not missing, f"missing from wheel: {sorted(missing)}"
          print(f"wheel contains all {len(required)} required files: {wheel}")
          PY

      - name: CLI entry point smoke
        run: |
          pip install --no-deps .
          triagedesk --version
